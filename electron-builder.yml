appId: com.headdraftsmen.app
productName: Head Draughtsman App
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
# sharp ships platform-native binaries: a *.node addon plus libvips shared
# libraries (.dll on Windows, .dylib on macOS). Windows DLLs in particular
# cannot be dlopen'd from inside the asar archive, so unpack sharp and its
# @img/* platform packages to the real filesystem on every platform.
asarUnpack:
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
extraResources:
  - from: resources/seed-state.json
    to: seed-state.json
  - from: resources/schedule-a-template.xlsx
    to: schedule-a-template.xlsx
  - from: resources/tender-notice-template.docx
    to: tender-notice-template.docx
  - from: resources/bid-document-template.docx
    to: bid-document-template.docx
  - from: resources/intimation-template.docx
    to: intimation-template.docx
  - from: resources/work-order-template.docx
    to: work-order-template.docx
  - from: resources/agreement-template.docx
    to: agreement-template.docx
  - from: resources/forwarding-slip-template.docx
    to: forwarding-slip-template.docx
  - from: resources/loa-se-template.docx
    to: loa-se-template.docx
  - from: resources/loa-se-reserved-template.docx
    to: loa-se-reserved-template.docx
  - from: resources/boq-template.xlsx
    to: boq-template.xlsx
  - from: resources/deviation-template.xlsx
    to: deviation-template.xlsx
  - from: resources/material-estimation-template.xlsx
    to: material-estimation-template.xlsx
  - from: resources/models/all-MiniLM-L6-v2
    to: models/all-MiniLM-L6-v2
  - from: resources/ocr-models
    to: ocr-models
publish:
  provider: github
  owner: radhakrishnaghmc
  repo: head-draftsmen-app
mac:
  icon: build/icon.icns
  target:
    - dmg
    - zip
  category: public.app-category.productivity
win:
  icon: build/icon.ico
  target:
    - nsis
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Office

appId: com.headdraftsmen.app
productName: Head Draughtsman App
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  # onnxruntime-web (the browser/WASM backend) is a dependency of
  # @huggingface/transformers, but our embedding feature only ever runs in
  # the Electron main process (electron/embeddingsWorker.ts, invoked over
  # IPC) — transformers.js auto-selects onnxruntime-node there, so the web
  # backend is never loaded. Confirmed no import of 'onnxruntime-web' or
  # '@huggingface/transformers' outside that one main-process worker file.
  - '!**/node_modules/onnxruntime-web/**'
  # transformers.js caches any model it's asked to load into a `.cache/`
  # folder INSIDE its own node_modules dir (not something npm installs — it
  # only appears if a model was actually run locally, e.g. while testing).
  # It's easy to forget it's there since node_modules isn't in git, and
  # electron-builder will otherwise happily ship whatever's sitting in it
  # (a stray 665MB Qwen2.5-0.5B cache is what blew up v1.18.0's installer
  # size — see MEMORY/PROJECT notes). Exclude on principle, not just once.
  - '!**/node_modules/**/.cache/**'
# sharp ships platform-native binaries: a *.node addon plus libvips shared
# libraries (.dll on Windows, .dylib on macOS). Windows DLLs in particular
# cannot be dlopen'd from inside the asar archive, so unpack sharp and its
# @img/* platform packages to the real filesystem on every platform.
asarUnpack:
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'

mac:
  icon: build/icon.icns
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  # onnxruntime-node ships prebuilt native binaries for every platform in one
  # npm package (win32/linux/darwin × x64/arm64) — and @huggingface/transformers
  # pulls in a SECOND, differently-versioned copy of the same package nested in
  # its own node_modules. Neither is split into per-platform optional packages
  # (unlike sharp/@img, which npm already installs only the matching one of),
  # so both copies' other-platform folders ship dead weight unless stripped here.
  files:
    - '!**/node_modules/onnxruntime-node/bin/napi-v6/win32/**'
    - '!**/node_modules/onnxruntime-node/bin/napi-v6/linux/**'
    - '!**/node_modules/@huggingface/transformers/node_modules/onnxruntime-node/bin/napi-v6/win32/**'
    - '!**/node_modules/@huggingface/transformers/node_modules/onnxruntime-node/bin/napi-v6/linux/**'
win:
  icon: build/icon.ico
  target:
    - nsis
  files:
    - '!**/node_modules/onnxruntime-node/bin/napi-v6/darwin/**'
    - '!**/node_modules/onnxruntime-node/bin/napi-v6/linux/**'
    - '!**/node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'
    - '!**/node_modules/@huggingface/transformers/node_modules/onnxruntime-node/bin/napi-v6/darwin/**'
    - '!**/node_modules/@huggingface/transformers/node_modules/onnxruntime-node/bin/napi-v6/linux/**'
    - '!**/node_modules/@huggingface/transformers/node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Office

appId: com.headdraftsmen.app
productName: Head Draughtsman App
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  # onnxruntime-web (the browser/WASM backend) is a dependency of
  # @huggingface/transformers, but our embedding feature only ever runs in
  # the Electron main process (electron/embeddingsWorker.ts, invoked over
  # IPC) — transformers.js auto-selects onnxruntime-node there, so the web
  # backend is never loaded. Confirmed no import of 'onnxruntime-web' or
  # '@huggingface/transformers' outside that one main-process worker file.
  - '!**/node_modules/onnxruntime-web/**'
  # transformers.js caches any model it's asked to load into a `.cache/`
  # folder INSIDE its own node_modules dir (not something npm installs — it
  # only appears if a model was actually run locally, e.g. while testing).
  # It's easy to forget it's there since node_modules isn't in git, and
  # electron-builder will otherwise happily ship whatever's sitting in it
  # (a stray 665MB Qwen2.5-0.5B cache is what blew up v1.18.0's installer
  # size — see MEMORY/PROJECT notes). Exclude on principle, not just once.
  - '!**/node_modules/**/.cache/**'
  # @huggingface/transformers ships its raw TypeScript source (src/) and
  # type declarations (types/) alongside the compiled dist/ it actually
  # resolves to (its own package.json "main"/"exports" point only at
  # dist/transformers.node.cjs) — src/ and types/ are never require()'d at
  # runtime, only useful to a TypeScript compiler, so they're dead weight
  # in a packaged app (6.4MB).
  - '!**/node_modules/@huggingface/transformers/src/**'
  - '!**/node_modules/@huggingface/transformers/types/**'
  # Likewise @techstark/opencv-js (a transitive dep of the OCR pipeline)
  # ships a full generated .d.ts type tree under dist/src/types/ — again
  # compile-time only, never required at runtime (1.1MB).
  - '!**/node_modules/@techstark/opencv-js/dist/src/types/**'
  # lodash/fp (the functional-programming variant) is a separate opt-in
  # entry point nobody in this app or its dependencies imports — confirmed
  # no 'lodash/fp' require anywhere in our code or html-to-docx's bundled
  # dist (1.6MB).
  - '!**/node_modules/lodash/fp/**'
  # dayjs ships a locale file per language; exceljs (the only thing that
  # pulls dayjs in) never calls dayjs.locale() or requires dayjs/locale/*,
  # so every locale but the built-in default (English) is unused (1.2MB).
  - '!**/node_modules/dayjs/locale/**'
  - '!**/node_modules/dayjs/esm/locale/**'
# sharp ships platform-native binaries: a *.node addon plus libvips shared
# libraries (.dll on Windows, .dylib on macOS). Windows DLLs in particular
# cannot be dlopen'd from inside the asar archive, so unpack sharp and its
# @img/* platform packages to the real filesystem on every platform.
# onnxruntime-node (used by @gutenye/ocr-node's estimate-photo OCR, and by
# @huggingface/transformers' embeddings — which ships its own nested copy of
# the same package) has the identical problem: on Windows, onnxruntime_binding.node
# sits next to sibling DLLs (onnxruntime.dll, DirectML.dll, dxil.dll,
# dxcompiler.dll) that it LoadLibrary()s at runtime. If those stay packed
# inside app.asar, Windows can't resolve them and the addon fails to load
# with "The specified module could not be found" — so unpack the whole
# package, both copies, everywhere.
asarUnpack:
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
  - '**/node_modules/onnxruntime-node/**'
  - '**/node_modules/@huggingface/transformers/node_modules/onnxruntime-node/**'
